[build]
  publish = "."
  functions = "netlify/functions"

# Checkout called relatively (api/checkout) so it works at / and at /customize/
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200
[[redirects]]
  from = "/customize/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

# Studio also reachable at /customize/ (same files)
[[redirects]]
  from = "/customize"
  to = "/customize/"
  status = 301
[[redirects]]
  from = "/customize/"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/customize/assets/*"
  to = "/assets/:splat"
  status = 200
[[redirects]]
  from = "/customize/orders.html"
  to = "/orders.html"
  status = 200
